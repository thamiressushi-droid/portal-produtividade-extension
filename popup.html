<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Portal Produtividade</title>

  <style>
    body {
      width: 320px;
      padding: 10px;
      font-family: Arial, sans-serif;
    }

    h2 {
      margin-top: 0;
    }

    .registro {
      border-bottom: 1px solid #ddd;
      padding: 8px 0;
    }

    #sync-status {
      margin-bottom: 12px;
      padding: 8px;
      background: #f3f3f3;
      overflow-wrap: anywhere;
    }

    #auth-warning {
      margin-bottom: 12px;
      padding: 10px;
      border: 1px solid #b54708;
      border-radius: 4px;
      background: #fff4e5;
      color: #7a2e0e;
    }

    #auth-warning[hidden] {
      display: none;
    }

    #connect-portal {
      margin-top: 8px;
      padding: 7px 10px;
      border: 0;
      border-radius: 4px;
      background: #8a3412;
      color: #fff;
      cursor: pointer;
    }

    #connect-error {
      display: block;
      margin-top: 6px;
      overflow-wrap: anywhere;
    }

    #capture-diagnostics {
      margin-bottom: 12px;
      padding: 8px;
      background: #f3f3f3;
    }

    #capture-diagnostics dl {
      margin: 8px 0 0;
    }

    #capture-diagnostics dt {
      margin-top: 6px;
      font-weight: bold;
    }

    #capture-diagnostics dd {
      margin: 2px 0 0;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    #diagnostics-updated {
      color: #555;
      font-size: 12px;
    }

    #monitor-status {
      margin-bottom: 12px;
      padding: 8px;
      background: #eef6ff;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    #exceptional-actions button {
      margin: 6px 6px 0 0;
      padding: 7px 10px;
    }
  </style>
</head>
<body>

  <h2>Portal Produtividade</h2>

  <section id="auth-warning" aria-live="assertive" hidden>
    <strong>⚠️ Sessão desconectada ou expirada</strong><br>
    <button id="connect-portal" type="button">Conectar ao Portal</button>
    <span id="connect-error" role="status"></span>
  </section>
  <section id="monitor-status" aria-live="polite"></section>
  <section id="exceptional-actions" aria-live="polite" hidden>
    <strong>Encerramento do expediente</strong><br>
    <button id="exceptional-confirm" type="button">Sim, continuar monitoramento</button>
    <button id="exceptional-end" type="button">Não, encerrar expediente</button>
  </section>
  <section id="sync-status" aria-live="polite"></section>
  <section id="capture-diagnostics" aria-live="polite">
    <strong>Diagnóstico da captura (último clique)</strong>
    <div id="diagnostics-updated">Aguardando clique em uma página...</div>
    <dl>
      <dt>URL</dt>
      <dd id="diagnostic-url">—</dd>
      <dt>tab_title</dt>
      <dd id="diagnostic-tab-title">—</dd>
      <dt>window_title</dt>
      <dd id="diagnostic-window-title">—</dd>
      <dt>screen_name</dt>
      <dd id="diagnostic-screen-name">—</dd>
      <dt>screen_context</dt>
      <dd id="diagnostic-screen-context">—</dd>
    </dl>
  </section>
  <div id="lista"></div>

  <script src="popup.js"></script>

</body>
</html>
